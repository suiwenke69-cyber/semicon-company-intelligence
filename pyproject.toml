[project]
name = "semicon-agent"
version = "0.1.0"
description = "Semiconductor Company Intelligence Agent - evidence-grounded company analysis"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
semicon = "main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["semicon", "semicon.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
