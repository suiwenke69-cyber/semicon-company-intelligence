  - name: "ASML"
    ticker: "ASML"
    cik: null
    aliases: ["ASML Holding"]
    sector_role: "equipment"
    fiscal_year_end: "12-31"
    # Foreign private issuer: files 20-F, not 10-K. The form-type-aware adapter
    # handles this without special-casing.
    relevant_process_steps:
      - "Lithography"
      - "Metrology"

  - name: "Micron"
    ticker: "MU"
    cik: null
