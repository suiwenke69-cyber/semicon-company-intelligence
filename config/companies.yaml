    fiscal_year_end: "09-30"
    relevant_process_steps: []

  - name: "NXP"
    # Ticker is NXPI, not NXP. The bare ticker 'NXP' belongs to NUVEEN SELECT TAX
    # FREE INCOME PORTFOLIO (CIK 0000883618), a closed-end fund, so an exact ticker
    # match silently resolved to the wrong entity. CIK pinned as a guard.
    ticker: "NXPI"
    cik: "0001413447"
    aliases: ["NXP Semiconductors", "NXP Semiconductors N.V.", "NXPI"]
    sector_role: "idm"
    fiscal_year_end: "12-31"
