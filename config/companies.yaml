# Adding a company should require editing THIS FILE ONLY.
#
# `cik` is optional: leave it null and resolve.py will look it up from the SEC
# ticker map by `ticker` or `aliases`. Pinning it avoids a network call and removes
# any chance of resolving to the wrong entity.
#
# sector_role drives which parts of the analysis framework are emphasised:
#   equipment | materials | foundry | idm | fabless | eda | osat
#
# fiscal_year_end is a sanity check against the filings, not a source of truth.

companies:
  - name: "Applied Materials"
    ticker: "AMAT"
    cik: "0000006951"
    aliases: ["Applied Materials Inc", "AMAT", "Applied"]
    sector_role: "equipment"
    fiscal_year_end: "10-31"
    # Process steps this company plausibly participates in. Used to constrain the
    # extraction taxonomy so the model selects rather than invents.
    relevant_process_steps:
      - "Deposition"
      - "Etch"
      - "Process Control"
      - "Inspection"
      - "Metrology"
      - "Implantation"
      - "CMP"
      - "Advanced Packaging"
      - "Thermal Processing"
      - "Materials Engineering"

  # Placeholders below are intentionally NOT yet verified against EDGAR. Steps 1-2
  # only need Applied Materials; these exist to prove the config shape generalises.
  - name: "Lam Research"
    ticker: "LRCX"
    cik: null
    aliases: ["Lam Research Corp", "Lam"]
    sector_role: "equipment"
    fiscal_year_end: "06-30"
    relevant_process_steps:
      - "Etch"
      - "Deposition"
      - "CMP"
      - "Advanced Packaging"

  - name: "KLA"
    ticker: "KLAC"
    cik: null
    aliases: ["KLA Corporation", "KLA-Tencor"]
    sector_role: "equipment"
    fiscal_year_end: "06-30"
    relevant_process_steps:
      - "Process Control"
